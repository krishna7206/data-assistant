version: "3.9"

services:
  nl-sql-assistant:
    build:
      context: .
    container_name: nl-sql-assistant
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - ./database:/app/database
      - ./app:/app
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy  # Blocks until Ollama completes boot & model download

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    # Use a sidecar entrypoint pattern: Boot serve, wait for the socket via bash, pull model, then hold process
    entrypoint: >
      /bin/sh -c "
      ollama serve & 
      pid=\$!; 
      echo 'Waiting for Ollama port...'; 
      while ! case [[:alpha:]] in *) (echo > /dev/tcp/127.0.0.1/11434) 2>/dev/null ;; esac; do sleep 1; done; 
      echo 'Pulling micro-model...';
      ollama pull qwen2.5:0.5b; 
      wait \$pid
      "
    # Clean check verifying the main loop state matches without relying on curl
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -q 'qwen2.5:0.5b' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 5s

volumes:
  ollama_data: