version: "3.9"

services:
  nl-sql-assistant:
    build:
      context: .
    container_name: nl-sql-assistant
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - ./database:/app/database
      - ./app:/app
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy  # Wait specifically until Ollama is fully healthy and ready

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    # 1. Removed the complex background wait logic. The container runs standard 'serve'.
    entrypoint: ["ollama", "serve"]
    # 2. Added a native health check that automatically pulls your model once the engine boots
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434/api/tags || exit 1 && ollama pull qwen2.5:0.5b"]
      interval: 10s
      timeout: 30s
      retries: 5
      start_period: 5s

volumes:
  ollama_data: